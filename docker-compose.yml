# Local development services for Relevantr Phase 1.
#
#   docker compose up -d qdrant
#   docker compose logs -f qdrant
#   docker compose down
#
# The Qdrant data lives in ./data/qdrant (git-ignored). The FastAPI server
# runs on the host, not in Docker, because it loads the local embedding and
# reranker models and reads the PDF folder.

services:
  qdrant:
    # Runs as a non-root user (UID 1000) so ./data/qdrant stays owned by you.
    image: qdrant/qdrant:v1.20.0-unprivileged
    restart: unless-stopped
    ports:
      # Bind to localhost only: this is a dev database, not a public service.
      - "127.0.0.1:6333:6333"  # REST
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
